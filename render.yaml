services:
  - type: web
    name: anti-forensics-detection
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_PATH
        value: /data/anti_forensics.db
      - key: REPORTS_DIR
        value: /data/reports
      - key: EVIDENCE_VAULT
        value: /data/evidence_vault
